<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matemática Divertida</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--papel:#f7fbff;--grade:#cfe3f5;--tinta:#1d2b4f;--lapis:#ffc933;--certo:#2fb36d;--erro:#e8544e;--azul:#3a6fe0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Baloo 2",system-ui,sans-serif;color:var(--tinta);background-color:var(--papel);
    background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);background-size:32px 32px}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
  header h1{margin:0;font-size:2rem;font-weight:800}
  #pontos{font-size:1.6rem;font-weight:800;background:var(--lapis);border:3px solid var(--tinta);border-radius:14px;padding:2px 16px}
  main{display:grid;grid-template-columns:1fr;gap:20px;padding:0 24px 24px;max-width:1100px;margin:0 auto}
  main.com-lado{grid-template-columns:1fr 300px}
  @media(max-width:800px){main.com-lado{grid-template-columns:1fr}}
  .caixa{background:#fff;border:3px solid var(--tinta);border-radius:18px;padding:20px;box-shadow:5px 5px 0 var(--tinta)}
  .tela{display:none}.tela.ativa{display:block}
  @media(prefers-reduced-motion:no-preference){.tela.ativa{animation:fade .3s}@keyframes fade{from{opacity:0}}
    .pula{animation:pula .4s}@keyframes pula{40%{transform:scale(1.2)}}.treme{animation:treme .3s}@keyframes treme{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}}
  h2{margin:.2em 0 .4em}
  input{font:inherit;font-size:1.6rem;width:100%;padding:8px 12px;border:3px solid var(--tinta);border-radius:12px}
  button,.chip{font:inherit;font-weight:700;font-size:1.5rem;border:3px solid var(--tinta);border-radius:14px;background:var(--lapis);color:var(--tinta);padding:10px 20px;cursor:pointer;box-shadow:3px 3px 0 var(--tinta)}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:4px solid var(--azul);outline-offset:2px}
  .sel{background:var(--azul)!important;color:#fff}
  .opcoes{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .opcoes button,.chip{font-size:2.4rem;min-width:130px;padding:18px;text-align:center}
  .chip{touch-action:none;user-select:none;background:#fff}
  .chip.unidade{display:flex;flex-direction:column;gap:2px;font-size:1.8rem;line-height:1.1;min-width:160px;padding:12px 10px}
  .chip.unidade small{font-size:1rem}
  .chip.arrasta{position:relative;z-index:9;background:var(--lapis)}
  #alvo{width:200px;height:110px;margin:10px auto;border:4px dashed var(--tinta);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800}
  #prog{text-align:center;font-size:1.2rem}
  #texto{font-size:3rem;font-weight:800;text-align:center;margin:6px 0}
  .guia{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:520px;margin:0 auto}
  #personagem{font-size:2.8rem;line-height:1}
  #ouvir{font-size:1.1rem;padding:6px 12px}
  #cena{text-align:center;font-size:2.6rem;min-height:3.2rem;margin:4px 0}
  #t-pausa{text-align:center;min-height:360px}
  #t-pausa.ativa{display:grid;justify-items:center;align-content:center}
  #pausa-personagem{font-size:5rem}
  #pausa-contagem{font-size:1.5rem;font-weight:700}
  #memoria-pares{font-size:1.3rem;font-weight:800}
  #tabuleiro-memoria{display:grid;grid-template-columns:repeat(3,min(18vw,82px));gap:8px;justify-content:center;margin:10px 0}
  #tabuleiro-memoria button{width:100%;aspect-ratio:1;padding:0;font-size:2rem}
  #tabuleiro-memoria button.virada{background:#fff6cf}
  #tabuleiro-memoria button.par-encontrado{background:var(--certo);color:#fff}
  #visor{font-size:3rem;text-align:center;min-height:72px;border:3px dashed var(--tinta);border-radius:14px;margin-bottom:12px;font-weight:800}
  .teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
  #msg{min-height:2.4rem;text-align:center;font-size:1.7rem;font-weight:700;margin-top:8px}
  #msg.ok{color:var(--certo)}#msg.erro{color:var(--erro)}
  #dica{display:none;background:#fff6cf;border:3px solid var(--tinta);border-radius:12px;padding:8px 14px;margin-top:8px;font-size:1.4rem;text-align:center}
  .certo{background:var(--certo)!important;color:#fff!important}
  ol{padding:0;list-style:none;margin:0}
  ol li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:2px dotted var(--grade);font-size:1.3rem}
  ol li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}ol li.eu{font-weight:800;background:#fff6cf}
  .conf{position:fixed;top:-3rem;font-size:2rem;pointer-events:none;animation:cai 1.4s ease-in forwards;z-index:20}
  @keyframes cai{to{transform:translateY(115vh) rotate(360deg)}}
  @media(min-width:801px) and (min-height:620px){
    body{height:100vh;overflow:hidden}
    header{height:58px;padding:4px 20px}
    header h1{font-size:1.6rem}
    #pontos{font-size:1.3rem;padding:0 12px}
    main{height:calc(100vh - 58px);padding:0 20px 12px;gap:14px;overflow:hidden}
    main.com-lado{grid-template-columns:minmax(0,1fr) 250px}
    main>section,.caixa#lado{min-height:0;overflow:hidden}
    .caixa{padding:12px;border-width:2px;border-radius:12px;box-shadow:3px 3px 0 var(--tinta)}
    #t-jogo.ativa{display:grid;align-content:center;gap:2px}
    #texto{font-size:2.2rem;line-height:1.12;margin:2px 0}
    #cena{font-size:2rem;min-height:2rem;margin:0}
    #personagem{font-size:2.1rem}
    #ouvir{font-size:1rem;padding:4px 10px}
    #visor{font-size:2rem;min-height:46px;margin-bottom:6px;border-width:2px}
    .teclado{max-width:300px;gap:6px}
    .teclado button{font-size:1.2rem;padding:6px 10px;border-width:2px;border-radius:10px}
    .opcoes{gap:8px;margin:4px 0}
    .opcoes button,.chip{font-size:1.8rem;min-width:92px;padding:10px}
    #alvo{width:150px;height:70px;margin:4px auto;font-size:2rem;border-width:3px}
    #msg{min-height:1.7rem;font-size:1.3rem;margin-top:2px}
    #dica{font-size:1rem;padding:4px 8px;margin-top:4px}
    ol li{font-size:1rem;padding:4px 0}
    #t-pausa{min-height:0;gap:4px}
    #pausa-personagem{font-size:3rem}
    #t-pausa p{margin:4px 0}
    #tabuleiro-memoria{grid-template-columns:repeat(3,64px);gap:6px;margin:4px 0}
    #tabuleiro-memoria button{font-size:1.6rem;border-width:2px;border-radius:10px}
    #pausa-contagem{font-size:1.1rem}
  }
  @media(prefers-reduced-motion:reduce){.conf{display:none}}
</style>
</head>
<body>
<header><h1>🧮 Matemática Divertida</h1><div id="pontos" hidden>0 pontos</div></header>
<main id="main">
  <section class="caixa">
    <div id="t-fechado" class="tela" style="text-align:center"><h2>Ainda não começou.</h2><p style="font-size:1.5rem">Aguarde a sua aula! 🕒</p></div>

    <div id="t-cadastro" class="tela">
      <h2>Como você se chama?</h2><input id="nome" maxlength="30" autocomplete="off">
      <h2>Quantos anos você tem?</h2><div class="opcoes" id="idades"></div>
      <p style="text-align:center"><button id="b-entrar" disabled>Entrar</button></p>
    </div>

    <div id="t-espera" class="tela" style="text-align:center">
      <h2 id="ola"></h2><p style="font-size:1.7rem">Aguardando o professor iniciar a atividade...</p>
      <div style="font-size:4rem">⏳</div><p id="conect" style="font-size:1.4rem"></p>
    </div>

    <div id="t-jogo" class="tela">
      <div id="prog"></div>
      <div class="guia"><span id="personagem" aria-hidden="true">🤖</span><button id="ouvir" type="button" aria-label="Ouvir o enunciado">🔊 Ouvir pergunta</button></div>
      <div id="cena" aria-hidden="true"></div><div id="texto"></div>
      <div id="a-digitar"><div id="visor"></div><div class="teclado" id="teclado"></div></div>
      <div id="a-clicar" class="opcoes"></div>
      <div id="a-arrastar"><div id="alvo">?</div><div class="opcoes" id="chips"></div></div>
      <div id="msg" role="status" aria-live="polite"></div><div id="dica"></div>
    </div>

    <div id="t-pausa" class="tela">
      <div id="pausa-personagem" aria-hidden="true">🤖</div>
      <h2>Pausa rápida: jogo da memória</h2>
      <p>Encontre os três pares antes da próxima rodada.</p>
      <div id="memoria-pares" role="status" aria-live="polite">Pares: 0 de 3</div>
      <div id="tabuleiro-memoria" role="group" aria-label="Jogo da memória">
        <button type="button" data-carta="0" aria-label="Carta 1, fechada">?</button>
        <button type="button" data-carta="1" aria-label="Carta 2, fechada">?</button>
        <button type="button" data-carta="2" aria-label="Carta 3, fechada">?</button>
        <button type="button" data-carta="3" aria-label="Carta 4, fechada">?</button>
        <button type="button" data-carta="4" aria-label="Carta 5, fechada">?</button>
        <button type="button" data-carta="5" aria-label="Carta 6, fechada">?</button>
      </div>
      <div id="pausa-contagem" role="status" aria-live="polite"></div>
    </div>

    <div id="t-fim" class="tela" style="text-align:center">
      <h2 id="fim-titulo"></h2><div id="fim-emoji" style="font-size:5rem"></div>
      <p id="fim-premio" style="font-size:2rem;font-weight:800;margin:0"></p>
      <p id="fim-info" style="font-size:1.4rem"></p>
    </div>
  </section>

  <aside class="caixa" id="lado" hidden>
    <h2 style="margin-top:0">🏆 Ranking da sala</h2>
    <ol id="rank"></ol>
  </aside>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const api = async (u, b) => {
  const controle = new AbortController(), timeout = setTimeout(() => controle.abort(), 10000);
  try {
    const r = await fetch(u, { ...(b ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) } : {}), signal: controle.signal });
    return await r.json();
  } finally { clearTimeout(timeout); }
};
const mostrar = (id) => document.querySelectorAll('.tela').forEach((t) => t.classList.toggle('ativa', t.id === id));
const EMOJI = { Bronze: '🥉', Prata: '🥈', Ouro: '🥇', 'Troféu': '🏆', Coroa: '👑' };
const NOMES_UNIDADES = { mm: 'milímetros', cm: 'centímetros', m: 'metros', km: 'quilômetros', g: 'gramas', kg: 'quilogramas', mL: 'mililitros', L: 'litros' };

let aluno = null, q = null, digitado = '', travado = false, total = 0, dados = [], idade = null, encerrada = false;
let pausaTimer = null, jogoMemoriaAtivo = false, cartasMemoria = [], cartasViradas = [], paresMemoria = [], bloqueioMemoria = null, pacoteMemoriaAnterior = -1;

const CENAS = {
  soma: [['🧺', '🍎'], ['🛒', '🍌'], ['🚀', '⭐']],
  subtracao: [['🎈', '☁️'], ['🐑', '🌧️'], ['🍪', '🥛']],
  multiplicacao: [['🤖', '🧱'], ['📦', '✏️'], ['🍕', '🧀']],
  sequencia: [['🚂', '🚃'], ['🐸', '🪷'], ['🚀', '🪐']],
  par_impar: [['🧦', '🧦'], ['🐟', '🪣'], ['🌷', '🦋']],
  maior_menor: [['🌳', '🍎'], ['🐘', '🐭'], ['⚖️', '🧸']],
  formas: [['🏠', '🔺'], ['🪟', '🟦'], ['🏰', '🔷']],
  medidas: [['🚂', '📏'], ['🧃', '🥄'], ['🐜', '📐']],
  antecessor_sucessor: [['🪨', '🐸'], ['🔢', '⭐'], ['🪜', '🎈']],
};
const PACOTES_MEMORIA = [
  ['🐸', '🚀', '🍎'], ['🐟', '🐢', '🦀'], ['🐶', '🐱', '🐰'],
  ['🌙', '⭐', '☁️'], ['🚒', '🚜', '✈️'], ['🦋', '🌼', '🐝'],
];
const ELOGIOS_ROBO = ['Mandou bem!', 'Resposta certeira!', 'O robô vibrou!', 'Show de cálculo!'];
const INCENTIVOS_ROBO = ['Quase! Tente mais uma vez.', 'Boa tentativa! Pense com calma.', 'Todo desafio ensina algo.'];

function mostrarCena(atividade, numero) {
  const temas = CENAS[atividade] || [['🤖', '✨']];
  $('cena').replaceChildren(...temas[(numero - 1) % temas.length].map((item) => {
    const elemento = document.createElement('span'); elemento.textContent = item; return elemento;
  }));
}

function desenharCartasMemoria() {
  document.querySelectorAll('#tabuleiro-memoria [data-carta]').forEach((botao) => {
    const indice = Number(botao.dataset.carta);
    const aberta = cartasViradas.includes(indice) || paresMemoria.includes(indice);
    const encontrada = paresMemoria.includes(indice);
    botao.textContent = aberta ? cartasMemoria[indice] : '?';
    botao.classList.toggle('virada', aberta);
    botao.classList.toggle('par-encontrado', encontrada);
    botao.disabled = encontrada;
    botao.setAttribute('aria-label', aberta ? `Carta ${indice + 1}: ${cartasMemoria[indice]}` : `Carta ${indice + 1}, fechada`);
  });
}

function pararJogoMemoria() {
  jogoMemoriaAtivo = false;
  if (bloqueioMemoria) clearTimeout(bloqueioMemoria);
  bloqueioMemoria = null; cartasViradas = [];
  desenharCartasMemoria();
}

function iniciarJogoMemoria() {
  pararJogoMemoria();
  let pacote = Math.floor(Math.random() * PACOTES_MEMORIA.length);
  if (pacote === pacoteMemoriaAnterior) {
    pacote = (pacote + 1 + Math.floor(Math.random() * (PACOTES_MEMORIA.length - 1))) % PACOTES_MEMORIA.length;
  }
  pacoteMemoriaAnterior = pacote;
  cartasMemoria = [...PACOTES_MEMORIA[pacote], ...PACOTES_MEMORIA[pacote]];
  for (let i = cartasMemoria.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cartasMemoria[i], cartasMemoria[j]] = [cartasMemoria[j], cartasMemoria[i]];
  }
  cartasViradas = []; paresMemoria = []; jogoMemoriaAtivo = true;
  $('memoria-pares').textContent = 'Pares: 0 de 3';
  desenharCartasMemoria();
}

$('tabuleiro-memoria').onclick = (e) => {
  const botao = e.target.closest('[data-carta]');
  if (!jogoMemoriaAtivo || !botao) return;
  const indice = Number(botao.dataset.carta);
  if (paresMemoria.includes(indice) || cartasViradas.includes(indice)) return;
  cartasViradas.push(indice); desenharCartasMemoria();
  if (cartasViradas.length < 2) return;
  const [primeira, segunda] = cartasViradas;
  if (cartasMemoria[primeira] === cartasMemoria[segunda]) {
    paresMemoria.push(primeira, segunda); cartasViradas = [];
    const totalPares = paresMemoria.length / 2;
    $('memoria-pares').textContent = totalPares === 3 ? 'Você encontrou todos os pares!' : `Pares: ${totalPares} de 3`;
    if (totalPares === 3) {
      jogoMemoriaAtivo = false;
      $('memoria-pares').textContent = 'Muito bem! Novo desafio chegando...';
      bloqueioMemoria = setTimeout(() => { bloqueioMemoria = null; iniciarJogoMemoria(); }, 900);
    }
    desenharCartasMemoria();
    return;
  }
  jogoMemoriaAtivo = false;
  bloqueioMemoria = setTimeout(() => {
    cartasViradas = []; bloqueioMemoria = null; jogoMemoriaAtivo = true; desenharCartasMemoria();
  }, 700);
};

function iniciarPausa() {
  if (pausaTimer) clearInterval(pausaTimer);
  let restante = 20;
  $('pausa-contagem').textContent = `Próxima rodada em ${restante} segundos`;
  iniciarJogoMemoria(); mostrar('t-pausa');
  pausaTimer = setInterval(() => {
    restante--;
    if (restante <= 0) {
      clearInterval(pausaTimer); pausaTimer = null; pararJogoMemoria(); proxima();
    } else $('pausa-contagem').textContent = `Próxima rodada em ${restante} segundos`;
  }, 1000);
}

// ---------- sons e confete ----------
let ac; const som = (f, d = .15, t = 'sine') => { try { ac ??= new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.value = f; g.gain.value = .12; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch {} };
const confete = () => { for (let i = 0; i < 24; i++) { const s = document.createElement('span'); s.className = 'conf'; s.textContent = ['🎉', '⭐', '🎈', '✨'][i % 4];
  s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .3 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 1800); } };

// ---------- início ----------
async function init() {
  const salvo = JSON.parse(localStorage.getItem('aluno') || 'null');
  const e = await api('/api/estado' + (salvo ? '?alunoId=' + salvo.id : ''));
  if (e.aluno) { aluno = e.aluno; return entrar(e.status); }
  localStorage.removeItem('aluno'); aluno = null; encerrada = false;
  $('lado').hidden = true; $('main').classList.remove('com-lado'); $('pontos').hidden = true; total = 0;
  mostrar(e.sessao ? 't-cadastro' : 't-fechado');
}
[7, 8, 9].forEach((n) => { const b = document.createElement('button'); b.textContent = n;
  b.onclick = () => { idade = n; [...$('idades').children].forEach((c) => c.classList.toggle('sel', c === b)); valida(); }; $('idades').appendChild(b); });
const valida = () => { $('b-entrar').disabled = !($('nome').value.trim() && idade); };
$('nome').oninput = valida;
$('b-entrar').onclick = async () => {
  const r = await api('/api/alunos', { nome: $('nome').value, idade });
  if (r.erro) return alert(r.erro);
  aluno = { id: r.alunoId, nome: r.nome }; localStorage.setItem('aluno', JSON.stringify(aluno)); entrar(r.status);
};
function entrar(status) {
  $('lado').hidden = false; $('main').classList.add('com-lado'); $('pontos').hidden = false;
  socket.emit('entrar', { alunoId: aluno.id });
  $('ola').textContent = `Olá, ${aluno.nome}! 👋`;
  status === 'iniciada' ? proxima() : mostrar('t-espera');
}

// ---------- jogo ----------
async function proxima() {
  if (pausaTimer) { clearInterval(pausaTimer); pausaTimer = null; }
  pararJogoMemoria();
  travado = false; digitado = ''; $('msg').textContent = ''; $('msg').className = ''; $('dica').style.display = 'none';
  const r = await api('/api/pergunta', { alunoId: aluno.id });
  if (r.encerrada) return fim();
  if (r.fim) return fim(r.resumo);
  if (r.erro) return mostrar('t-espera');
  q = r;
  const perguntaRodada = (r.numero - 1) % 5 + 1, numeroRodada = Math.floor((r.numero - 1) / 5) + 1;
  $('prog').textContent = `Rodada ${numeroRodada} · Pergunta ${perguntaRodada} de 5${r.total ? ` · ${r.numero} de ${r.total} no total` : ''}`;
  $('texto').textContent = r.texto; mostrarCena(r.atividade, r.numero);
  $('a-digitar').style.display = r.tipo === 'digitar' ? 'block' : 'none';
  $('a-clicar').style.display = r.tipo === 'clicar' ? 'flex' : 'none';
  $('a-arrastar').style.display = r.tipo === 'arrastar' ? 'block' : 'none';
  if (r.tipo === 'digitar') montarTeclado();
  if (r.tipo === 'clicar') { $('a-clicar').innerHTML = ''; r.opcoes.forEach((o) => { const b = document.createElement('button'); b.textContent = o; b.onclick = () => enviar(o, b); $('a-clicar').appendChild(b); }); }
  if (r.tipo === 'arrastar') { $('alvo').textContent = '?'; $('alvo').classList.remove('certo'); $('chips').innerHTML = ''; r.opcoes.forEach((o) => $('chips').appendChild(chip(o))); }
  mostrar('t-jogo');
}
$('ouvir').onclick = () => {
  if (!q || !('speechSynthesis' in window)) { $('msg').textContent = 'A leitura em voz alta não está disponível neste navegador.'; return; }
  window.speechSynthesis.cancel();
  const fala = new SpeechSynthesisUtterance(q.texto); fala.lang = 'pt-BR'; fala.rate = 0.9;
  window.speechSynthesis.speak(fala);
};
function montarTeclado() {
  $('visor').textContent = ''; $('teclado').innerHTML = '';
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'OK'].forEach((k) => { const b = document.createElement('button'); b.textContent = k; b.onclick = () => tecla(k); $('teclado').appendChild(b); });
}
function tecla(k) {
  if (travado) return;
  if (k === '⌫') digitado = digitado.slice(0, -1);
  else if (k === 'OK') { if (digitado) enviar(digitado); return; }
  else if (digitado.length < 4) digitado += k;
  $('visor').textContent = digitado;
}
document.addEventListener('keydown', (e) => {
  if (!$('t-jogo').classList.contains('ativa') || q?.tipo !== 'digitar') return;
  if (/^\d$/.test(e.key)) tecla(e.key); else if (e.key === 'Backspace') tecla('⌫'); else if (e.key === 'Enter') tecla('OK');
});
function chip(valor) { // arrastar com mouse ou dedo; um toque simples também responde
  const c = document.createElement('div'); c.className = 'chip'; c.dataset.valor = valor;
  const nome = NOMES_UNIDADES[valor];
  if (nome) {
    c.classList.add('unidade');
    const sigla = document.createElement('span'); sigla.textContent = valor;
    const descricao = document.createElement('small'); descricao.textContent = nome;
    c.append(sigla, descricao); c.setAttribute('aria-label', `${nome} (${valor})`);
  } else c.textContent = valor;
  let x0, y0, mov = false;
  c.onpointerdown = (e) => { if (travado) return; c.setPointerCapture(e.pointerId); x0 = e.clientX; y0 = e.clientY; mov = false; c.classList.add('arrasta'); };
  c.onpointermove = (e) => { if (!c.hasPointerCapture(e.pointerId)) return; const dx = e.clientX - x0, dy = e.clientY - y0; if (Math.abs(dx) + Math.abs(dy) > 8) mov = true; c.style.transform = `translate(${dx}px,${dy}px)`; };
  c.onpointerup = (e) => { c.classList.remove('arrasta'); c.style.transform = ''; const a = $('alvo').getBoundingClientRect();
    const dentro = e.clientX >= a.left && e.clientX <= a.right && e.clientY >= a.top && e.clientY <= a.bottom;
    if (!mov || dentro) { $('alvo').textContent = valor; enviar(valor, c); } };
  return c;
}
async function enviar(resposta, el) {
  if (travado) return; travado = true;
  const msg = $('msg');
  msg.textContent = 'Enviando resposta...'; msg.className = '';
  let r;
  try { r = await api('/api/resposta', { alunoId: aluno.id, resposta }); }
  catch {
    msg.textContent = 'Não foi possível confirmar. Verifique a conexão e tente novamente.';
    msg.className = 'erro'; travado = false; return;
  }
  if (r.erro) { msg.textContent = r.erro; msg.className = 'erro'; travado = false; return; }
  if (r.correta) {
    total += r.pontos; $('pontos').textContent = total + ' pontos'; $('pontos').classList.add('pula'); setTimeout(() => $('pontos').classList.remove('pula'), 500);
    el?.classList.add('certo'); if (q.tipo === 'arrastar') $('alvo').classList.add('certo');
    const elogio = ELOGIOS_ROBO[Math.floor(Math.random() * ELOGIOS_ROBO.length)];
    msg.textContent = `✅ ${elogio} +${r.pontos}`; msg.className = 'ok'; som(660); setTimeout(() => som(880), 120); confete();
    const fimRodada = q.numero % 5 === 0;
    return setTimeout(() => { if (r.fim) fim(r.resumo); else if (fimRodada) iniciarPausa(); else proxima(); }, 1300);
  }
  const incentivo = r.erros < 3 ? INCENTIVOS_ROBO[Math.floor(Math.random() * INCENTIVOS_ROBO.length)] : (r.mensagem || 'Vamos com calma!');
  som(200, .25, 'triangle'); msg.textContent = '🤖 ' + incentivo; msg.className = 'erro'; el?.classList.add('treme'); setTimeout(() => el?.classList.remove('treme'), 400);
  if (q.tipo === 'arrastar') $('alvo').textContent = '?';
  if (r.dica) { $('dica').innerHTML = '💡 ' + r.dica.texto + (r.dica.visual ? `<br>${r.dica.visual}` : ''); $('dica').style.display = 'block'; }
  if (r.terminou) {
    msg.textContent = `✅ A resposta é ${r.respostaCerta}`; msg.className = 'ok';
    document.querySelectorAll('#a-clicar button,#chips .chip').forEach((b) => { if ((b.dataset.valor || b.textContent) === r.respostaCerta) b.classList.add('certo'); });
    if (q.tipo === 'arrastar') { $('alvo').textContent = r.respostaCerta; $('alvo').classList.add('certo'); }
    if (q.tipo === 'digitar') $('visor').textContent = r.respostaCerta;
    const fimRodada = q.numero % 5 === 0;
    return setTimeout(() => fimRodada ? iniciarPausa() : proxima(), 3200);
  }
  digitado = ''; if (q.tipo === 'digitar') $('visor').textContent = ''; travado = false;
}

// ---------- fim ----------
async function fim(res) {
  if (pausaTimer) { clearInterval(pausaTimer); pausaTimer = null; }
  pararJogoMemoria();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  res = res || await api('/api/resumo/' + aluno.id);
  $('fim-titulo').textContent = encerrada ? 'Fim da aula!' : 'Você terminou! 🎉';
  $('fim-emoji').textContent = EMOJI[res.premio] || '⭐'; $('fim-premio').textContent = res.premio;
  $('fim-info').textContent = `${res.pontos} pontos · ${res.nota} · ${res.posicao}º lugar` + (encerrada ? '' : ' — aguarde o professor encerrar.');
  mostrar('t-fim'); if (!encerrada) confete();
}

// ---------- ranking e tempo real ----------
function pintar() {
  $('rank').innerHTML = '';
  dados.forEach((a, i) => { const li = document.createElement('li'); if (a.id === aluno?.id) li.className = 'eu';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = `${['🥇', '🥈', '🥉'][i] || i + 1 + 'º'} ${a.nome}`;
    const p = document.createElement('b'); p.textContent = a.pontos + ' pts'; li.append(n, p); $('rank').appendChild(li); });
}

const socket = io();
socket.on('connect', () => aluno && socket.emit('entrar', { alunoId: aluno.id }));
socket.on('ranking', (d) => { dados = d; pintar(); });
socket.on('conectados', (n) => ($('conect').textContent = `Alunos conectados: ${n}`));
socket.on('iniciada', () => aluno && proxima());
socket.on('encerrada', (d) => { dados = d; pintar(); if (aluno) { encerrada = true; localStorage.removeItem('aluno'); fim(); } });
socket.on('estado', () => { if (!aluno) init(); });
init();
</script>
